<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <title>ניהול תוכן - ששון לוי</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- קוד להפניה אוטומטית עם invite_token -->
    <script>
      if (window.location.hash && window.location.hash.includes("invite_token")) {
        window.location.href = "/admin/" + window.location.hash;
      }
    </script>

    <!-- טעינת Netlify CMS -->
    <script src="https://unpkg.com/netlify-cms@latest/dist/netlify-cms.js"></script>
    <script>
      window.addEventListener('load', function () {
        if (typeof CMS !== 'undefined') {
          CMS.init();
        } else {
          console.error("Netlify CMS not loaded");
        }
      });
    </script>
  </body>
</html>
