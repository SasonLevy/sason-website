<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <title>ניהול תוכן - ששון לוי</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="nc-root"></div>

    <!-- שמירה על ההפניות של invite_token ו-recovery_token בתוך hash -->
    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("invite_token") || params.get("recovery_token");

      if (token && !window.location.hash.includes(token)) {
        window.location.hash = `#${params.toString()}`;
        window.location.search = '';
      }
    </script>

    <!-- טעינת Netlify CMS -->
    <script src="https://unpkg.com/netlify-cms@latest/dist/netlify-cms.js"></script>

    <script>
      window.addEventListener('load', function () {
        if (typeof CMS !== 'undefined') {
          CMS.init();
        } else {
          console.error("Netlify CMS not loaded");
        }
      });
    </script>
  </body>
</html>
